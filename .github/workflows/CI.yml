name: Backup and restore scripts CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  bash-test:
    name: Basic Bash Execution
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Check scripts are executable
        run: |
          chmod +x scripts/*.sh
      - name: Dry-run backup.sh (syntax only)
        run: |
          bash -n scripts/backup.sh
      - name: Dry-run restore.sh (syntax only)
        run: |
          bash -n scripts/restore.sh

  pg-test:
    name: PostgreSQL Backup/Restore test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: testpass
      DB_NAME: testdb
      DB_USER: testuser
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -U testuser && break
            sleep 2
          done
      - name: Prepare test database
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE TABLE test (id SERIAL PRIMARY KEY, val TEXT);"
          psql -h localhost -U testuser -d testdb -c "INSERT INTO test (val) VALUES ('foo'), ('bar');"
      - name: Generate age key pair
        run: |
          age-keygen -o testkey.agekey
          age-keygen -o testkey.pub -y testkey.agekey
      - name: Adapt backup script for the test
        run: |
          sed -i 's|DB_NAME=""|DB_NAME="testdb"|' scripts/backup.sh
          sed -i 's|AGE_PUB_KEY=""|AGE_PUB_KEY="$(pwd)/testkey.pub"|' scripts/backup.sh
          sed -i 's|OUTPUT_FILE=""|OUTPUT_FILE="$(pwd)/backup.dump.age"|' scripts/backup.sh
      - name: Make a backup
        run: |
          chmod +x scripts/backup.sh
          export PGHOST=localhost
          export PGPORT=5432
          export PGUSER=testuser
          export PGPASSWORD=testpass
          ./scripts/backup.sh
      - name: Delete data from test table
        run: |
          psql -h localhost -U testuser -d testdb -c "DELETE FROM test;"
      - name: Adapt restore script for the test
        run: |
          sed -i 's|DB_NAME=""|DB_NAME="testdb"|' scripts/restore.sh
          sed -i 's|AGE_PRIVATE_KEY=""|AGE_PRIVATE_KEY="$(pwd)/testkey.agekey"|' scripts/restore.sh
      - name: Restore from backup
        run: |
          chmod +x scripts/restore.sh
          export PGHOST=localhost
          export PGPORT=5432
          export PGUSER=testuser
          export PGPASSWORD=testpass
          ./scripts/restore.sh backup.dump.age
      - name: Verify data restored
        run: |
          psql -h localhost -U testuser -d testdb -c "SELECT * FROM test;"
